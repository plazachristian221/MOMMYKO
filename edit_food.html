{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white"><h5>Update Menu Item #{{ food.id }}</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Dish Name</label>
                        <input type="text" name="name" class="form-control" value="{{ food.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <input type="text" name="description" class="form-control" value="{{ food.description }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Price (₱)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ food.price }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Branch Location</label>
                        <input type="text" name="branch" class="form-control" value="{{ food.branch }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
